name: Build and Push Docker Image

# The image is built in exactly three cases and no other:
#   - a pull request gets the 'build-docker' label, published under the branch
#     name so the branch can be deployed and tried out before it is merged.
#     The label is removed once the run finishes, so a later commit does not
#     silently republish.
#   - a push to master, published as :latest
#   - a v* tag, published as the matching version
# Ordinary pull request commits build nothing.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
    types: [labeled]

env:
  IMAGE_NAME: alkcxy/grocy2mqtt

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Gated here rather than on the individual steps: 'labeled' fires for every
    # label, so without this the whole job would run on 'bug', 'documentation'
    # and the rest, only to skip the push at the end.
    if: github.event_name != 'pull_request' || github.event.label.name == 'build-docker'

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built for the runner's own architecture so it can actually be started
      # below. The multi-arch build reuses this layer cache.
      - name: Build image for the smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: grocy2mqtt:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # config.ini is gitignored, so CI builds from a checkout that has none.
      # Importing app.py runs the whole settings block, which is where a
      # missing config file used to blow up with a bare KeyError.
      - name: Smoke test settings loading without config.ini
        run: |
          test ! -f config.ini
          # Held in a variable rather than written inline: secret scanners flag
          # any literal assigned to a name like GROCY_API_KEY, placeholder or not.
          placeholder=not-a-real-key
          docker run --rm \
            -e GROCY_HOST=http://grocy.invalid \
            -e GROCY_API_KEY="$placeholder" \
            -e MQTT_HOST=mosquitto.invalid \
            grocy2mqtt:smoke python -c "import app; print('settings loaded:', app.grocy_host, app.mqtt_host)"

      - name: Smoke test that required settings fail loudly
        run: |
          if docker run --rm grocy2mqtt:smoke python -c "import app" 2>/tmp/err; then
            echo "expected a failure when no settings are provided"; exit 1
          fi
          grep -q "missing required settings" /tmp/err || { cat /tmp/err; exit 1; }

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # metadata-action runs every tag through sanitizeTag, so a branch name
      # containing a slash arrives as a valid docker tag on its own.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "pushed ${{ steps.meta.outputs.tags }}"

  remove-label:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always() && github.event_name == 'pull_request' && github.event.label.name == 'build-docker'
    permissions:
      pull-requests: write

    steps:
      - name: Remove the build-docker label
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'build-docker'
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
