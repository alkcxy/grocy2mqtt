name: Build and Push Docker Image

# The image is built in exactly three cases and no other:
#   - a pull request gets the 'build-docker' label, published under the branch
#     name so the branch can be deployed and tried out before it is merged.
#     The label is removed once the run finishes, so a later commit does not
#     silently republish.
#   - a push to master that changes something the image is made of, published
#     as :latest. A push that only touches documentation is skipped: it would
#     produce a byte-identical image.
#   - a v* tag, published as the matching version. Always, regardless of what
#     changed, because a release must be publishable on demand.
# Ordinary pull request commits build nothing.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
    types: [labeled]

env:
  IMAGE_NAME: alkcxy/grocy2mqtt

jobs:
  # A push to master that changes only documentation produces a byte-identical
  # image, so building it wastes a few minutes and republishes :latest for
  # nothing. This decides whether the push touched anything the image is made
  # of.
  #
  # Deliberately a job condition rather than an `on.push.paths` filter: that
  # filter would also apply to the `tags: v*` trigger, and a tag pointing at a
  # commit that is already on master pushes no new commits, so the filter would
  # match nothing and silently stop publishing releases.
  decide:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.label.name == 'build-docker'
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - id: check
        env:
          # What the image is made of, plus this workflow. Any .py anywhere,
          # not just the two at the root: the Dockerfile ends with COPY . .,
          # so a module added in a subdirectory tomorrow is executed code too.
          # README.md is excluded by .dockerignore; LICENSE and .gitignore are
          # copied but cannot change how the container behaves.
          RELEVANT: '\.py$|^(Dockerfile|pyproject\.toml|uv\.lock|\.dockerignore|\.github/workflows/docker-build\.yml)$'
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = tag ] || [ "${{ github.event_name }}" = pull_request ]; then
            echo "A release tag or an explicitly labelled pull request always builds."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD)
          echo "Changed in this push:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE "$RELEVANT"; then
            echo "Something the image is built from changed."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the image is built from changed; skipping the build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built for the runner's own architecture so it can actually be started
      # below. The multi-arch build reuses this layer cache.
      - name: Build image for the smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: grocy2mqtt:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # config.ini is gitignored, so CI builds from a checkout that has none.
      # Importing app.py runs the whole settings block, which is where a
      # missing config file used to blow up with a bare KeyError.
      - name: Smoke test settings loading without config.ini
        run: |
          test ! -f config.ini
          # Held in a variable rather than written inline: secret scanners flag
          # any literal assigned to a name like GROCY_API_KEY, placeholder or not.
          placeholder=not-a-real-key
          docker run --rm \
            -e GROCY_HOST=http://grocy.invalid \
            -e GROCY_API_KEY="$placeholder" \
            -e MQTT_HOST=mosquitto.invalid \
            grocy2mqtt:smoke python -c "import app; print('settings loaded:', app.grocy_host, app.mqtt_host)"

      - name: Smoke test that required settings fail loudly
        run: |
          if docker run --rm grocy2mqtt:smoke python -c "import app" 2>/tmp/err; then
            echo "expected a failure when no settings are provided"; exit 1
          fi
          grep -q "missing required settings" /tmp/err || { cat /tmp/err; exit 1; }

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # metadata-action runs every tag through sanitizeTag, so a branch name
      # containing a slash arrives as a valid docker tag on its own.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "pushed ${{ steps.meta.outputs.tags }}"

  remove-label:
    runs-on: ubuntu-latest
    needs: [decide, build-and-push]
    if: always() && github.event_name == 'pull_request' && github.event.label.name == 'build-docker'
    permissions:
      pull-requests: write

    steps:
      - name: Remove the build-docker label
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'build-docker'
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
